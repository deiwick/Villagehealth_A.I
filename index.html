    <style>
        body { font-family: 'Inter', sans-serif; }
        .audio-pulse { animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
        }
        .form-input {
            width: 100%;
            background-color: #f1f5f9;
            border: none;
            border-radius: 1rem;
            padding: 0.75rem 1rem;
            font-size: 0.875rem;
            font-weight: 600;
            color: #1e293b;
            outline: none;
            transition: box-shadow 0.15s;
        }
        .form-input:focus { box-shadow: 0 0 0 2px #e11d48; }
        .form-select {
            width: 100%;
            background-color: #f1f5f9;
            border: none;
            border-radius: 1rem;
            padding: 0.75rem 2.5rem 0.75rem 1rem;
            font-size: 0.875rem;
            font-weight: 600;
            color: #1e293b;
            appearance: none;
            outline: none;
            transition: box-shadow 0.15s;
            cursor: pointer;
        }
        .form-select:focus { box-shadow: 0 0 0 2px #e11d48; }
        .animate-in { animation: fadeIn 0.3s ease; }
        .fade-in { animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
